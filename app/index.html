<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <!-- Saved English/Russian choice: left-to-right before the first paint (the app sets it fully when it loads). -->
  <script>try { var l = localStorage.getItem('tt-lang'); if (l === 'en' || l === 'ru') { document.documentElement.lang = l; document.documentElement.dir = 'ltr'; } } catch (e) {}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>טיולון – הוצאות טיול</title>
  <meta name="description" content="מעקב משותף אחר הוצאות והכנסות בטיול, עם התחשבנות בסוף">
  <meta name="theme-color" content="#F3F6FA">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="טיולון">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div id="banner"></div>
  <main id="app" class="app"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="print" aria-hidden="true"></div>
  <!-- Catch Android's install offer early: it can fire before the app module finishes loading. -->
  <script>addEventListener('beforeinstallprompt', e => { e.preventDefault(); window.ttInstall = e; dispatchEvent(new Event('tt-install')); });</script>
  <script src="./version.js"></script>
  <script type="module" src="./js/app.js"></script>
  <noscript>יש להפעיל JavaScript כדי להשתמש בטיולון.</noscript>
</body>
</html>
