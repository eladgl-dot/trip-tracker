<!doctype html>
<html><head><meta charset="utf-8"><title>icon</title>
<style>
  html,body{margin:0;width:512px;height:512px;overflow:hidden;background:transparent}
  .bg{width:512px;height:512px;display:grid;place-items:center;background:linear-gradient(135deg,#BAE6FD,#DDD6FE)}
  .round{border-radius:112px}
  .mask .inner{transform:scale(.72)}
  .inner{position:relative;width:300px;height:300px}
  .bag{position:absolute;left:40px;top:80px;width:220px;height:190px;border-radius:44px;background:#fff;box-shadow:0 16px 40px rgba(2,132,199,.25)}
  .handle{position:absolute;left:100px;top:30px;width:100px;height:80px;border:22px solid #fff;border-bottom:0;border-radius:36px 36px 0 0;box-sizing:border-box}
  .band{position:absolute;left:40px;top:150px;width:220px;height:26px;background:#7DD3FC}
  .coin{position:absolute;left:170px;top:170px;width:110px;height:110px;border-radius:50%;background:#A7F3D0;border:10px solid #fff;display:grid;place-items:center;font:800 64px Arial,sans-serif;color:#047857;box-sizing:border-box}
</style></head>
<body><div class="bg" id="b"><div class="inner"><div class="handle"></div><div class="bag"></div><div class="band"></div><div class="coin">₪</div></div></div>
<script>const m=location.hash.slice(1); if(m==='round') b.classList.add('round'); if(m==='mask') b.classList.add('mask');</script>
</body></html>
